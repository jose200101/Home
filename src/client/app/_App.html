<script type="text/babel">
  const { useEffect, useState, useRef } = React;

  /**
   * Wrapper seguro para google.script.run
   */
  function gasCall(fnName, ...args) {
    if (!["login", "validateToken", "logout"].includes(fnName)) {
      args.push({ homeToken: localStorage.getItem("APP_TOKEN") || "" });
    }
    return new Promise((resolve, reject) => {
      try {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(err => reject(err))
          [fnName](...args);
      } catch (e) {
        reject(e);
      }
    });
  }

  function SpinnerInline({ label = "Cargando..." }) {
    return (
      <span className="d-inline-flex align-items-center gap-2">
        <span className="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        <span className="tiny">{label}</span>
      </span>
    );
  }

  function LoginView({ onLoggedIn }) {
    const [username, setUsername] = useState("");
    const [password, setPassword] = useState("");
    const [showPass, setShowPass] = useState(false);
    const [loading, setLoading] = useState(false);
    const [error, setError] = useState("");

    async function handleSubmit(e) {
      e.preventDefault();
      setError("");

      if (!username.trim() || !password.trim()) {
        setError("Completa usuario y contraseña.");
        return;
      }

      setLoading(true);
      try {
        const res = await gasCall("login", username.trim(), password.trim());
        if (res && res.ok) {
          // Persistimos token para mantener sesión
          localStorage.setItem("APP_TOKEN", res.token);
          localStorage.setItem("APP_USER", JSON.stringify(res.user));
          onLoggedIn(res.user, res.token);
        } else {
          setError((res && res.message) || "Credenciales inválidas.");
        }
      } catch (err) {
        setError(String(err?.message || err));
      } finally {
        setLoading(false);
      }
    }

    return (
      <div className="auth-wrap">
        <div className="auth-card">
          <div className="card-body">
            <div className="brand-ring">
              <div className="brand-logo">
                <i className="bi bi-house-heart fs-1" aria-hidden="true"></i>
              </div>
            </div>

            <h1 className="brand-title">Entrar a Home</h1>

            <form onSubmit={handleSubmit} noValidate>
              <div className="mb-3">
                <label className="form-label" htmlFor="home-login-user">
                  <span className="req">*</span>Usuario
                </label>
                <div className="input-group">
                  <span className="input-group-text">
                    <i className="bi bi-person" aria-hidden="true"></i>
                  </span>
                  <input
                    className="form-control auth-input"
                    id="home-login-user" required value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    placeholder="Usuario"
                    autoComplete="username"
                  />
                </div>
              </div>

              <div className="mb-2">
                <label className="form-label" htmlFor="home-login-password">
                  <span className="req">*</span>Contraseña
                </label>
                <div className="input-group">
                  <span className="input-group-text">
                    <i className="bi bi-lock" aria-hidden="true"></i>
                  </span>
                  <input
                    className="form-control auth-input"
                    type={showPass ? "text" : "password"}
                    id="home-login-password" required value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="••••••••"
                    autoComplete="current-password"
                  />
                  <button
                    type="button"
                    className="input-group-text"
                    onClick={() => setShowPass((s) => !s)}
                    title={showPass ? "Ocultar" : "Mostrar"}
                    aria-label={showPass ? "Ocultar contraseña" : "Mostrar contraseña"}
                  >
                    <i className={`bi ${showPass ? "bi-eye-slash" : "bi-eye"}`} aria-hidden="true"></i>
                  </button>
                </div>
              </div>

              <div className="d-flex justify-content-start mb-3">
                <a
                  className="link-muted tiny"
                  href="#"
                  onClick={(e) => {
                    e.preventDefault();
                    setError("Si olvidaste tu contraseña, contacta al administrador.");
                  }}
                >
                  ¿Olvidaste tu contraseña?
                </a>
              </div>

              {error ? (
                <div className="alert alert-danger py-2 small" role="alert">
                  <i className="bi bi-exclamation-triangle me-2" aria-hidden="true"></i>
                  {error}
                </div>
              ) : null}

              <button className="home-btn w-100" type="submit" disabled={loading}>
                {loading ? <SpinnerInline label="Verificando..." /> : "Ingresar"}
              </button>
            </form>

          </div>
        </div>
      </div>
    );
  }

  const homePages = [
    { id: "summary", label: "Inicio", icon: "bi-house" },
    { id: "charges", label: "Gastos", icon: "bi-receipt" },
    { id: "debts", label: "Préstamos", icon: "bi-arrow-left-right" },
    { id: "credits", label: "Créditos", icon: "bi-wallet2", secondary: true },
    { id: "history", label: "Historial", icon: "bi-clock-history", secondary: true },
    { id: "people", label: "Integrantes", icon: "bi-people", secondary: true },
    { id: "settings", label: "Configuración", icon: "bi-gear", secondary: true, admin: true },
  ];
  const legacyPages = [
    { id: "legacyPeople", label: "Personas anteriores", icon: "bi-people", views: [
      ["Personas", PersonasView], ["Usuarios", UsuariosView],
    ] },
    { id: "legacyExpenses", label: "Gastos anteriores", icon: "bi-archive", views: [
      ["Fijos", GastosFijosView], ["Variables", GastosVariablesView], ["Netos", GastosNetosView],
    ] },
    { id: "legacyLoans", label: "Préstamos anteriores", icon: "bi-cash-stack", views: [
      ["Solicitar", PrestamosSolicitarView], ["Otorgar", PrestamosOtorgarView],
    ] },
  ];

  function HomeNavigationItem({ page, current, onNavigate }) {
    return (
      <button type="button" className={"home-nav-item" + (page.secondary ? " home-nav-secondary" : "")}
        aria-current={current === page.id ? "page" : undefined}
        onClick={() => onNavigate(page.id)}>
        <i className={"bi " + page.icon} aria-hidden="true" />
        <span>{page.label}</span>
      </button>
    );
  }

  function ProtectedApp({ user, token, onLogout }) {
    const admin = ["admin", "administrador", "propietario"].includes(String(user?.rol || "").trim().toLowerCase());
    const [page, setPage] = useState("summary");
    const [ready, setReady] = useState(false);
    const [more, setMore] = useState(false);
    const [legacyTab, setLegacyTab] = useState({});
    const main = useRef(null);
    const moveFocus = useRef(false);
    const legacy = admin && legacyPages.find((item) => item.id === page);
    const visiblePages = homePages.filter((item) =>
      (ready || item.id === "summary") && (!item.admin || admin));
    const currentLegacyTab = legacyTab[page] || 0;
    const LegacyView = legacy ? legacy.views[currentLegacyTab][1] : null;

    function navigate(id) {
      setMore(false);
      if (id === page) return;
      moveFocus.current = true;
      setPage(id);
    }

    useEffect(() => {
      if (!moveFocus.current) return;
      moveFocus.current = false;
      window.scrollTo(0, 0);
      main.current?.focus({ preventScroll: true });
    }, [page]);

    return (
      <div className="home-layout">
        <a className="home-skip" href="#home-main">Saltar al contenido</a>
        <aside className="home-sidebar">
          <div className="home-brand"><i className="bi bi-house-heart" aria-hidden="true" /> Home</div>
          <nav className="home-nav" aria-label="Navegación principal">
            {visiblePages.map((item) => (
              <HomeNavigationItem key={item.id} page={item} current={page} onNavigate={navigate} />
            ))}
            <button type="button" className="home-nav-item home-nav-more"
              aria-haspopup="dialog" aria-expanded={more}
              aria-current={legacy || visiblePages.some((item) => item.secondary && item.id === page) ? "location" : undefined}
              onClick={() => setMore(true)}>
              <i className="bi bi-three-dots" aria-hidden="true" />
              <span>Más</span>
            </button>
          </nav>
        </aside>
        <main id="home-main" ref={main} tabIndex={-1} className="home-main">
          <div className="home-topbar">
            <span className="home-topbar-brand"><i className="bi bi-house-heart" aria-hidden="true" /> Home</span>
            <span className="home-account"><i className="bi bi-person-circle" aria-hidden="true" /> {user?.nombreCompleto || user?.nombre_usuario}</span>
          </div>
          <div className="home-content">
            {legacy ? (
              <div className="home-legacy">
                <h1>{legacy.label}</h1>
                <nav className="home-legacy-nav" aria-label={legacy.label}>
                  {legacy.views.map(([label], index) => (
                    <button type="button" key={label} className="home-btn home-btn-light"
                      aria-current={index === currentLegacyTab ? "page" : undefined}
                      onClick={() => setLegacyTab((tabs) => ({ ...tabs, [page]: index }))}>
                      {label}
                    </button>
                  ))}
                </nav>
                <LegacyView user={user} />
              </div>
            ) : (
              <HomeCuentasView token={token} tab={page} setTab={navigate} onReady={setReady} />
            )}
          </div>
        </main>
        {more && (
          <HomeDialog title="Más opciones" onClose={() => setMore(false)}>
            <div className="home-menu">
              <nav className="home-menu-secondary" aria-label="Secciones adicionales">
                {visiblePages.filter((item) => item.secondary).map((item) => (
                  <HomeNavigationItem key={item.id} page={item} current={page} onNavigate={navigate} />
                ))}
              </nav>
              {admin && (
                <nav aria-label="Módulos anteriores">
                  <h3>Módulos anteriores</h3>
                  {legacyPages.map((item) => (
                    <HomeNavigationItem key={item.id} page={item} current={page} onNavigate={navigate} />
                  ))}
                </nav>
              )}
              <button type="button" className="home-nav-item" onClick={onLogout}>
                <i className="bi bi-box-arrow-right" aria-hidden="true" />
                <span>Cerrar sesión</span>
              </button>
            </div>
          </HomeDialog>
        )}
      </div>
    );
  }

  function App() {
    const [booting, setBooting] = useState(true);
    const [user, setUser] = useState(null);
    const [token, setToken] = useState("");

    async function boot() {
      try {
        const t = (localStorage.getItem("APP_TOKEN") || "").trim();
        const uRaw = localStorage.getItem("APP_USER");
        if (!t || !uRaw) return;

        JSON.parse(uRaw);
        const res = await gasCall("validateToken", t);
        if (res && res.ok) {
          setUser(res.user);
          setToken(t);
        } else {
          localStorage.removeItem("APP_TOKEN");
          localStorage.removeItem("APP_USER");
        }
      } catch (e) {
        localStorage.removeItem("APP_TOKEN");
        localStorage.removeItem("APP_USER");
      } finally {
        setBooting(false);
      }
    }

    useEffect(() => { boot(); }, []);

    async function handleLogout() {
      const t = (localStorage.getItem("APP_TOKEN") || "").trim();
      localStorage.removeItem("APP_TOKEN");
      localStorage.removeItem("APP_USER");
      setUser(null);
      setToken("");

      if (t) {
        try { await gasCall("logout", t); } catch (e) {}
      }
    }

    if (booting) {
      return (
        <div className="auth-wrap">
          <div className="auth-card p-4" role="status">
            <SpinnerInline label="Cargando sesión…" />
          </div>
        </div>
      );
    }

    if (!user) {
      return <LoginView onLoggedIn={(u, t) => { setUser(u); setToken(t); }} />;
    }

    return <ProtectedApp user={user} token={token} onLogout={handleLogout} />;
  }

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
</script>
