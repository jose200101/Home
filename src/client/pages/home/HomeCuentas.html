<script type="text/babel">
  const homeCurrency = new Intl.NumberFormat("es-HN", { style: "currency", currency: "HNL" });
  const homeMoney = (cents) => homeCurrency.format(cents / 100);
  const homeLabels = {
    INIT: "Hogar configurado",
    PERSON: "Integrante actualizado",
    TEMPLATE: "Gasto configurado",
    CHARGE: "Factura registrada",
    DEBT: "Deuda registrada",
    PAYMENT: "Pago registrado",
    CONFIRM: "Pago confirmado",
    REJECT: "Pago rechazado",
    FUND: "Factura pagada al proveedor",
    VOID: "Movimiento anulado",
    AGREEMENT_PROPOSE: "Propuesta de acuerdo",
    AGREEMENT_RESPOND: "Respuesta al acuerdo",
    AGREEMENT_CANCEL: "Acuerdo cancelado",
    EXPENSE_SERVICE: "Propuesta de servicio",
    EXPENSE_PURCHASE: "Propuesta de compra",
    EXPENSE_RESPOND: "Respuesta al gasto",
    EXPENSE_INVOICE: "Factura registrada",
    EXPENSE_PAY: "Factura pagada al proveedor",
    REIMBURSEMENT_DECLARE: "Reembolso registrado",
    REIMBURSEMENT_DECIDE: "Respuesta al reembolso",
    LOAN_REQUEST: "Solicitud de préstamo",
    LOAN_DECIDE: "Respuesta al préstamo",
    CORRECTION_PROPOSE: "Propuesta de corrección",
    CORRECTION_DECIDE: "Respuesta a la corrección",
    CREDIT_REFUND_DECLARE: "Devolución declarada",
    CREDIT_APPLY_PROPOSE: "Aplicación de crédito propuesta",
    CREDIT_DECIDE: "Respuesta a la operación de crédito",
  };
  const homeMode = {
    equal: "Partes iguales",
    percent: "Porcentajes",
    amount: "Montos definidos",
  };
  const homeRpc = (name, ...args) =>
    new Promise((resolve, reject) =>
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        [name](...args),
    );
  const homeRequestId = () =>
    window.crypto?.randomUUID
      ? window.crypto.randomUUID()
      : "op_" + Date.now() + "_" + Math.random().toString(36).slice(2);

  function HomeField({ label, children, hint }) {
    const id = React.useId();
    return (
      <div className="home-field">
        <label htmlFor={id}>{label}</label>
        {React.cloneElement(children, { id, ...(hint && { "aria-describedby": id + "-hint" }) })}
        {hint && <small id={id + "-hint"}>{hint}</small>}
      </div>
    );
  }

  function HomeDialog({ title, onClose, busy, children }) {
    const ref = React.useRef(null);
    const titleId = React.useId();
    React.useEffect(() => {
      const el = ref.current;
      const trigger = document.activeElement;
      el.showModal();
      return () => {
        if (el.open) el.close();
        if (trigger?.isConnected) trigger.focus({ preventScroll: true });
      };
    }, []);
    return (
      <dialog
        ref={ref}
        className="home-dialog"
        aria-labelledby={titleId}
        onCancel={(e) => {
          e.preventDefault();
          if (!busy) onClose();
        }}
      >
        <div className="home-dialog-head">
          <h2 id={titleId}>{title}</h2>
          <button
            type="button"
            className="home-icon-btn"
            aria-label="Cerrar"
            disabled={busy}
            onClick={onClose}
          >
            ×
          </button>
        </div>
        {children}
      </dialog>
    );
  }

  function HomeNotice({ children, onDismiss }) {
    return (
      <div className={onDismiss ? "home-success" : "home-alert"} role={onDismiss ? "status" : "alert"}>
        <span>{children}</span>
        {onDismiss && <button type="button" className="home-icon-btn" aria-label="Cerrar aviso" onClick={onDismiss}>×</button>}
      </div>
    );
  }

  function HomeSummaryCard({ label, value, icon, emphasis, children }) {
    return (
      <article className={emphasis ? "home-stat home-stat-green" : "home-stat"}>
        <i className={"bi " + icon} aria-hidden="true" />
        <span>{label}</span>
        <strong>{value}</strong>
        {children}
      </article>
    );
  }

  function HomeBadge({ tone = "neutral", children }) {
    return <span className={"home-badge home-badge-" + tone}>{children}</span>;
  }

  function HomeEmpty({ icon, title, children }) {
    return (
      <div className="home-empty">
        <i className={"bi " + icon} aria-hidden="true" />
        <h3>{title}</h3>
        <p>{children}</p>
      </div>
    );
  }

  function HomeMovement({ title, detail, cents, children }) {
    return (
      <div className="home-list-row">
        <div><strong>{title}</strong><small>{detail}</small></div>
        <div className="home-right"><strong>{homeMoney(cents)}</strong>{children}</div>
      </div>
    );
  }

  function HomeCuentasView({ token, tab, setTab, onReady }) {
    const [data, setData] = React.useState(null);
    const [error, setError] = React.useState(""),
      [notice, setNotice] = React.useState(""),
      [loading, setLoading] = React.useState(true);
    const [modal, setModal] = React.useState(null),
      [form, setForm] = React.useState({}),
      [review, setReview] = React.useState(false),
      [busy, setBusy] = React.useState(false);
    const [requestId, setRequestId] = React.useState(""),
      [selected, setSelected] = React.useState(""),
      [period, setPeriod] = React.useState("");
    const [inventory, setInventory] = React.useState(null),
      [accounts, setAccounts] = React.useState([]),
      [formError, setFormError] = React.useState("");
    const submitLock = React.useRef(false);
    const name = (id) =>
      data?.people.find((p) => p.id === id)?.name ||
      (id ? "Integrante archivado" : "Proveedor");
    const activePeople = (data?.people || []).filter((p) => p.active);
    const participantPeople = (data?.people || []).filter(
      (p) => p.active || form.participants?.some((v) => v.personId === p.id),
    );
    const personId = data?.admin ? selected : data?.me;
    const today =
      data?.today ||
      new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/Tegucigalpa",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
      }).format(new Date());
    async function load() {
      setLoading(true);
      setError("");
      try {
        const state = await homeRpc("homeGetState", token);
        setData(state);
      } catch (e) {
        setError(e.message || String(e));
      } finally {
        setLoading(false);
      }
    }
    React.useEffect(() => {
      load();
    }, [token]);
    React.useEffect(() => {
      if (data) onReady(data.initialized);
    }, [data, onReady]);
    function open(type, values = {}) {
      setModal(type);
      setForm({
        date: today,
        due: today,
        period: today.slice(0, 7),
        active: true,
        mode: "equal",
        participants: [],
        ...values,
      });
      setRequestId(homeRequestId());
      setReview(false);
      setFormError("");
      setError("");
      if (type === "PERSON" && data.admin)
        homeRpc("listarUsuarios", {}, { homeToken: token })
          .then(setAccounts)
          .catch((e) => setFormError(e.message));
    }
    function change(key, value) {
      setForm((f) => ({ ...f, [key]: value }));
      setReview(false);
    }
    function participant(id, checked) {
      setForm((f) => ({
        ...f,
        participants: checked
          ? [...f.participants, { personId: id, value: "" }]
          : f.participants.filter((p) => p.personId !== id),
      }));
    }
    function close() {
      if (!busy) {
        setModal(null);
        setFormError("");
      }
    }
    async function submit(e) {
      e.preventDefault();
      if (submitLock.current) return;
      if (!review) {
        setReview(true);
        setFormError("");
        return;
      }
      submitLock.current = true;
      setBusy(true);
      setFormError("");
      try {
        const res = await homeRpc("homeExecute", token, {
          id: requestId,
          type: modal,
          payload: form,
        });
        setData(res.state);
        setNotice(homeLabels[modal] + ".");
        setModal(null);
      } catch (e) {
        setFormError(
          (e.message || String(e)) +
            " Puedes reintentar sin duplicar la operación.",
        );
      } finally {
        setBusy(false);
        submitLock.current = false;
      }
    }
    function selectTemplate(id) {
      const t = data.templates.find((t) => t.id === id);
      setForm((f) => ({
        ...f,
        templateId: id,
        mode: t?.mode || "equal",
        participants: (t?.participants || []).map((p) => ({ ...p })),
      }));
    }
    const allObs = data?.obligations || [];
    const obs = allObs.filter(
      (o) =>
        (!personId || o.debtorId === personId || o.creditorId === personId) &&
        (!period || (o.period || o.date.slice(0, 7)) === period),
    );
    const filteredPayments = (data?.payments || []).filter((p) =>
      (!personId || p.debtorId === personId || p.creditorId === personId) &&
      (!period || p.date.slice(0, 7) === period),
    );
    const pendingPayments = (data?.payments || []).filter(
      (p) => p.status === "pending",
    );
    const debtPayment =
      form.obligationId && allObs.find((o) => o.id === form.obligationId);
    const options = (empty = "Selecciona un integrante") => (
      <>
        <option value="">{empty}</option>
        {activePeople.map((p) => (
          <option key={p.id} value={p.id}>
            {p.name}
          </option>
        ))}
      </>
    );
    const input = (label, key, type = "text", hint, required = true) => (
      <HomeField label={label} hint={hint}>
        <input
          type={type}
          required={required}
          value={form[key] || ""}
          onChange={(e) => change(key, e.target.value)}
          {...(type === "number" ? { min: "0.01", step: "0.01" } : {})}
        />
      </HomeField>
    );
    const personSelect = (label, key, required = true, empty) => (
      <HomeField label={label}>
        <select
          required={required}
          value={form[key] || ""}
          onChange={(e) => change(key, e.target.value)}
        >
          {options(empty)}
        </select>
      </HomeField>
    );
    const participantsEditor = (
      <div className="home-participants">
        <h3>¿Quiénes participan?</h3>
        <p>Selecciona únicamente a quienes cubrirán este gasto.</p>
        {activePeople.length === 0 && (
          <p>Agrega integrantes antes de configurar un gasto.</p>
        )}
        {participantPeople.map((p) => {
          const item = form.participants?.find((v) => v.personId === p.id);
          return (
            <div className="home-participant" key={p.id}>
              <label>
                <input
                  type="checkbox"
                  checked={!!item}
                  onChange={(e) => participant(p.id, e.target.checked)}
                />
                <span>
                  {p.name}
                  {p.active ? "" : " (archivado)"}
                </span>
              </label>
              {item && form.mode !== "equal" && (
                <input
                  aria-label={`${form.mode === "percent" ? "Porcentaje" : "Monto"} de ${p.name}`}
                  type="number"
                  min="0"
                  step="0.01"
                  required
                  value={item.value}
                  placeholder={form.mode === "percent" ? "%" : "L"}
                  onChange={(e) => {
                    const value = e.target.value;
                    setForm((f) => ({
                      ...f,
                      participants: f.participants.map((v) =>
                        v.personId === p.id ? { ...v, value } : v,
                      ),
                    }));
                  }}
                />
              )}
            </div>
          );
        })}
        <small>
          {form.mode === "equal"
            ? "Los centavos sobrantes se distribuyen siguiendo el orden de selección."
            : form.mode === "percent"
              ? "Los porcentajes deben sumar 100 %."
              : "Los aportes deben sumar el total de la factura."}
        </small>
      </div>
    );

    if (loading && !data)
      return (
        <div className="home-shell home-loading" role="status">
          <SpinnerInline label="Cargando las cuentas del hogar…" />
        </div>
      );
    if (!data)
      return (
        <div className="home-shell">
          <h1>No pudimos cargar tus cuentas</h1>
          <HomeNotice>{error}</HomeNotice>
          <button className="home-btn" onClick={load}>
            Reintentar
          </button>
        </div>
      );
    return (
      <div className="home-shell">
        <header className="home-header">
          <div>
            {tab !== "summary" && <p className="home-context">{data.household}</p>}
            <h1>{tab === "summary" ? data.household : homePages.find((page) => page.id === tab)?.label}</h1>
          </div>
          <button type="button" className="home-btn home-btn-light" onClick={load} disabled={loading || busy}>
            <i className="bi bi-arrow-clockwise" aria-hidden="true" />{" "}
            {loading ? "Actualizando…" : "Actualizar"}
          </button>
        </header>
        {error && <HomeNotice>{error}</HomeNotice>}
        {notice && <HomeNotice onDismiss={() => setNotice("")}>{notice}</HomeNotice>}
        {!data.initialized ? (
          <section className="home-empty home-panel">
            <i className="bi bi-house-heart" />
            <h2>Empecemos por tu hogar</h2>
            <p>
              Configura el hogar, agrega sus integrantes y crea el primer gasto
              compartido.
            </p>
            {data.admin ? (
              <button
                className="home-btn"
                onClick={() => open("INIT", { name: "Mi hogar" })}
              >
                Configurar hogar
              </button>
            ) : (
              <p>Un administrador debe completar la configuración.</p>
            )}
          </section>
        ) : (
          <>
            {!data.admin && !data.me && tab !== "summary" && (
              <div className="home-alert">
                Tu cuenta todavía no está vinculada a un integrante activo. Pide
                al administrador que la vincule en Integrantes.
              </div>
            )}
            {["summary", "debts", "history", "charges"].includes(tab) &&
              (tab !== "summary" || data.admin || data.me) && (
              <div className={tab === "summary" ? "home-filters home-dashboard-filters" : "home-filters"}>
                {data.admin ? (
                  <HomeField label="Cuenta de">
                    <select
                      value={selected}
                      onChange={(e) => setSelected(e.target.value)}
                    >
                      <option value="">Todo el hogar</option>
                      {data.people.map((p) => (
                        <option key={p.id} value={p.id}>
                          {p.name}
                          {p.active ? "" : " (archivado)"}
                        </option>
                      ))}
                    </select>
                  </HomeField>
                ) : tab !== "summary" && (
                  <div className="home-profile">
                    <span className="home-avatar">
                      {name(data.me).slice(0, 1)}
                    </span>
                    <strong>{data.me ? name(data.me) : "Mi cuenta"}</strong>
                  </div>
                )}
                <HomeField label="Período" hint={tab === "summary" && period ? "El filtro se aplica a cuentas y actividad." : undefined}>
                  <input
                    aria-label="Período"
                    type="month"
                    value={period}
                    onChange={(e) => setPeriod(e.target.value)}
                  />
                </HomeField>
                {period && (
                  <button className="home-link" onClick={() => setPeriod("")}>
                    Ver todos
                  </button>
                )}
              </div>
            )}
            {tab === "summary" && (
              <HomeDashboard data={data} period={period} selected={selected}
                name={name} onNavigate={setTab} onCreate={() => open("TEMPLATE")} />
            )}
            {tab === "charges" && (
              <>
                {data.admin && (
                  <section>
                    <div className="home-section-head">
                      <div>
                        <h2>Gastos del hogar</h2>
                        <p>Define quién participa en cada servicio.</p>
                      </div>
                      <button
                        className="home-btn"
                        onClick={() => open("TEMPLATE")}
                      >
                        + Nuevo gasto
                      </button>
                    </div>
                    <div className="home-template-grid">
                      {data.templates.map((t) => (
                        <article
                          className={
                            "home-panel home-template " +
                            (!t.active ? "home-muted" : "")
                          }
                          key={t.id}
                        >
                          <div className="home-template-icon">
                            <i className="bi bi-receipt" />
                          </div>
                          <h3>{t.name}</h3>
                          <p>{t.provider || "Sin proveedor definido"}</p>
                          <div className="home-badge">{homeMode[t.mode]}</div>
                          <p>
                            {t.participants
                              .map((p) => name(p.personId))
                              .join(" · ")}
                          </p>
                          <div className="home-actions">
                            <button
                              className="home-btn home-btn-light"
                              onClick={() =>
                                open("TEMPLATE", {
                                  ...t,
                                  participants: t.participants.map((p) => ({
                                    ...p,
                                  })),
                                })
                              }
                            >
                              Editar
                            </button>
                            {t.active ? (
                              <button
                                className="home-btn"
                                onClick={() => {
                                  open("CHARGE", {
                                    templateId: t.id,
                                    mode: t.mode,
                                    participants: t.participants.map((p) => ({
                                      ...p,
                                    })),
                                  });
                                }}
                              >
                                Registrar factura
                              </button>
                            ) : (
                              <span className="home-badge">Archivado</span>
                            )}
                          </div>
                        </article>
                      ))}
                      {!data.templates.length && (
                        <div className="home-panel home-empty">
                          <h3>Elige qué gastos compartir</h3>
                          <p>
                            Puedes crear energía eléctrica, Claro u otros
                            servicios.
                          </p>
                        </div>
                      )}
                    </div>
                  </section>
                )}
                <section className="home-panel">
                  <h2>Facturas y reparto</h2>
                  <p>
                    Los participantes de cada factura quedan guardados con su
                    aporte.
                  </p>
                  {data.charges
                    .filter(
                      (c) =>
                        (!period || c.period === period) &&
                        (!personId ||
                          c.shares.some((s) => s.personId === personId) ||
                          c.payerId === personId),
                    )
                    .map((c) => (
                      <article className="home-charge" key={c.id}>
                        <div className="home-section-head">
                          <div>
                            <h3>
                              {c.name}{" "}
                              <span className="home-badge">{c.period}</span>
                            </h3>
                            <small>
                              Vence {c.due} ·{" "}
                              {c.payerId
                                ? "Pagó " + name(c.payerId)
                                : c.expenseKind
                                  ? "Pendiente de pago al proveedor"
                                  : "Ver estado de aportes abajo"}
                            </small>
                          </div>
                          <strong>{homeMoney(c.cents)}</strong>
                        </div>
                        <div className="home-share-list">
                          {c.shares
                            .filter((s) => data.admin || s.personId === data.me)
                            .map((s) => (
                              <span key={s.personId}>
                                {name(s.personId)}{" "}
                                <strong>{homeMoney(s.cents)}</strong>
                              </span>
                            ))}
                        </div>
                        <div className="home-actions">
                          {data.admin &&
                            !c.expenseKind &&
                            !c.payerId &&
                            allObs.some(
                              (o) =>
                                o.sourceId === c.id &&
                                !o.creditorId &&
                                o.pending > 0,
                            ) && (
                              <button
                                className="home-btn home-btn-light"
                                onClick={() => open("FUND", { chargeId: c.id })}
                              >
                                Un integrante pagó la factura completa
                              </button>
                            )}
                          {data.admin && !c.expenseKind && (
                            <button
                              className="home-link home-danger"
                              onClick={() =>
                                open("VOID", { targetId: c.id, name: c.name })
                              }
                            >
                              Anular factura
                            </button>
                          )}
                        </div>
                      </article>
                    ))}
                  {!data.charges.length && (
                    <div className="home-empty">
                      <p>Todavía no hay facturas registradas.</p>
                    </div>
                  )}
                </section>
              </>
            )}
            {tab === "debts" && (
              <>
                <div className="home-section-head">
                  <div>
                    <h2>Cuentas entre integrantes y aportes</h2>
                    <p>
                      Registrar un pago entre integrantes requiere confirmar la
                      recepción.
                    </p>
                  </div>
                  {data.admin && (
                    <button className="home-btn" onClick={() => open("DEBT")}>
                      + Registrar deuda
                    </button>
                  )}
                </div>
                {!!data.loans?.length && (
                  <section className="home-panel">
                    <h2>Solicitudes de préstamo</h2>
                    {data.loans
                      .filter((loan) => (!personId || loan.debtorId === personId || loan.creditorId === personId) &&
                        (!period || loan.date.slice(0, 7) === period))
                      .slice().reverse().map((loan) => (
                        <HomeMovement key={loan.id} title={loan.name} cents={loan.cents}
                          detail={name(loan.creditorId) + " → " + name(loan.debtorId) + " · " + (loan.due ? "Vence " + loan.due : "Sin vencimiento")}>
                          <HomeBadge tone={{ accepted: "success", pending: "warning", rejected: "danger" }[loan.status]}>
                            {{ accepted: "Aceptado", pending: "Esperando aceptación", rejected: "Rechazado", cancelled: "Cancelado" }[loan.status]}
                          </HomeBadge>
                        </HomeMovement>
                      ))}
                  </section>
                )}
                {pendingPayments.filter(
                  (p) =>
                    !personId ||
                    p.debtorId === personId ||
                    p.creditorId === personId,
                ).length > 0 && (
                  <section className="home-panel">
                    <h2>Pagos por confirmar</h2>
                    {pendingPayments
                      .filter(
                        (p) =>
                          !personId ||
                          p.debtorId === personId ||
                          p.creditorId === personId,
                      )
                      .map((p) => (
                        <div className="home-list-row" key={p.id}>
                          <div>
                            <strong>
                              {homeMoney(p.cents)} · {name(p.debtorId)} →{" "}
                              {name(p.creditorId)}
                            </strong>
                            <small>
                              {p.date} · {p.note}
                            </small>
                          </div>
                          {!p.expenseKind && !p.loanId &&
                          (data.admin || data.me === p.creditorId) ? (
                            <div className="home-actions">
                              <button
                                className="home-btn"
                                onClick={() =>
                                  open("CONFIRM", {
                                    paymentId: p.id,
                                    amount: (p.cents / 100).toFixed(2),
                                    name: `${name(p.debtorId)} → ${name(p.creditorId)}`,
                                  })
                                }
                              >
                                Confirmar recepción
                              </button>
                              <button
                                className="home-link home-danger"
                                onClick={() =>
                                  open("REJECT", { paymentId: p.id })
                                }
                              >
                                Rechazar
                              </button>
                            </div>
                          ) : (
                            <span className="home-badge">
                              Esperando al receptor
                            </span>
                          )}
                        </div>
                      ))}
                  </section>
                )}
                <section className="home-panel">
                  <h2>Saldos pendientes y liquidados</h2>
                  <div className="home-table-wrap">
                    <table className="home-table home-obligations" role="table">
                      <caption>Obligaciones y saldo pendiente</caption>
                      <thead role="rowgroup">
                        <tr role="row">
                          <th scope="col" role="columnheader">Concepto</th>
                          <th scope="col" role="columnheader">Quién debe</th>
                          <th scope="col" role="columnheader">A quién</th>
                          <th scope="col" role="columnheader">Saldo</th>
                          <th scope="col" role="columnheader">Acciones</th>
                        </tr>
                      </thead>
                      <tbody role="rowgroup">
                        {obs.map((o) => (
                          <tr role="row" key={o.id}>
                            <td role="cell" data-label="Concepto">
                              <strong>{o.name}</strong>
                              <small>
                                {o.period || o.date}
                                {o.due ? " · vence " + o.due : " · sin vencimiento"}
                              </small>
                            </td>
                            <td role="cell" data-label="Quién debe">{name(o.debtorId)}</td>
                            <td role="cell" data-label="A quién">{name(o.creditorId)}</td>
                            <td role="cell" data-label="Saldo">
                              <strong>{homeMoney(o.pending)}</strong>
                              {o.pending === 0 && (
                                <HomeBadge tone="success">
                                  {o.appliedCreditCents || !o.paid ? "Liquidado" : "Pagado"}
                                </HomeBadge>
                              )}
                              {o.reserved > 0 && (
                                <small>
                                  {homeMoney(o.reserved)} por confirmar
                                </small>
                              )}
                            </td>
                            <td role="cell" data-label="Acciones">
                              {!o.expenseKind && !o.loanId && o.pending - o.reserved > 0 &&
                                (data.admin || data.me === o.debtorId) &&
                                (!!o.creditorId || data.admin) && (
                                  <button
                                    className="home-btn home-btn-light"
                                    onClick={() =>
                                      open("PAYMENT", {
                                        obligationId: o.id,
                                        amount: (
                                          (o.pending - o.reserved) /
                                          100
                                        ).toFixed(2),
                                      })
                                    }
                                  >
                                    Registrar pago
                                  </button>
                                )}
                              {data.admin && o.kind === "debt" && (
                                <button
                                  className="home-link home-danger"
                                  onClick={() =>
                                    open("VOID", {
                                      targetId: o.sourceId,
                                      name: o.name,
                                    })
                                  }
                                >
                                  Anular
                                </button>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                    {!obs.length && (
                      <div className="home-empty">
                        No hay cuentas para este filtro.
                      </div>
                    )}
                  </div>
                </section>
                {data.admin && (
                  <section className="home-panel">
                    <h2>Propuesta para simplificar pagos</h2>
                    <p>
                      Considera todas las cuentas del hogar, sin aplicar los
                      filtros de arriba. No modifica ni cancela deudas. Acuerden
                      cualquier compensación antes de registrarla por separado.
                    </p>
                    {data.plan.map((p, i) => (
                      <div className="home-list-row" key={i}>
                        <span>
                          {name(p.debtorId)} → {name(p.creditorId)}
                        </span>
                        <strong>{homeMoney(p.cents)}</strong>
                      </div>
                    ))}
                    {!data.plan.length && (
                      <p>No hay transferencias sugeridas.</p>
                    )}
                  </section>
                )}
              </>
            )}
            {tab === "people" && (
              <>
                <div className="home-section-head">
                  <div>
                    <h2>Integrantes</h2>
                    <p>Cada persona tiene sus propios aportes y cuentas.</p>
                  </div>
                  {data.admin && (
                    <button className="home-btn" onClick={() => open("PERSON")}>
                      + Agregar integrante
                    </button>
                  )}
                </div>
                <div className="home-template-grid">
                  {data.people.map((p) => (
                    <article className="home-panel" key={p.id}>
                      <span className="home-avatar">{p.name.slice(0, 1)}</span>
                      <h3>{p.name}</h3>
                      <p>
                        {p.active ? "Activo" : "Archivado"}
                        {data.admin
                          ? p.userId
                            ? " · Con cuenta vinculada"
                            : " · Sin cuenta vinculada"
                          : ""}
                      </p>
                      <div className="home-actions">
                        {data.admin ? (
                          <>
                            <button
                              className="home-btn home-btn-light"
                              onClick={() => {
                                setSelected(p.id);
                                setTab("summary");
                              }}
                            >
                              Ver cuentas
                            </button>
                            <button
                              className="home-link"
                              onClick={() => open("PERSON", p)}
                            >
                              Editar
                            </button>
                          </>
                        ) : (
                          p.id === data.me && (
                            <button
                              className="home-btn home-btn-light"
                              onClick={() => setTab("summary")}
                            >
                              Ver mis cuentas
                            </button>
                          )
                        )}
                      </div>
                    </article>
                  ))}
                </div>
                {!data.people.length && (
                  <div className="home-panel home-empty">
                    Agrega a las personas que comparten los gastos de tu casa.
                  </div>
                )}
              </>
            )}
            {tab === "credits" && (
              <section className="home-panel">
                <h2>Saldos a favor</h2>
                <p>Los créditos se muestran aparte de los pagos y deudas. El saldo incluye los importes reservados hasta que se confirme una devolución o aplicación.</p>
                {data.credits?.length ? (
                  data.credits.slice().reverse().map((credit) => (
                    <HomeMovement key={credit.id}
                      title={allObs.find((obligation) => obligation.id === credit.obligationId)?.name || "Crédito por corrección"}
                      detail={"A favor de " + name(credit.beneficiaryId) + " · A cargo de " + name(credit.holderId)}
                      cents={credit.pending}>
                      {credit.reserved > 0 && <small>{homeMoney(credit.reserved)} en reserva</small>}
                      <HomeBadge tone={credit.pending > 0 ? "success" : "neutral"}>
                        {credit.pending > 0 ? homeMoney(credit.available) + " disponible" : "Sin saldo"}
                      </HomeBadge>
                    </HomeMovement>
                  ))
                ) : (
                  <HomeEmpty icon="bi-wallet2" title="Sin créditos registrados">
                    Los saldos a favor por correcciones aparecerán aquí.
                  </HomeEmpty>
                )}
              </section>
            )}
            {tab === "history" && (
              <>
                <section className="home-panel">
                  <h2>Historial de pagos</h2>
                  {filteredPayments
                    .slice()
                    .reverse()
                    .map((p) => (
                      <div className="home-list-row" key={p.id}>
                        <div>
                          <strong>
                            {homeMoney(p.cents)} · {name(p.debtorId)} →{" "}
                            {name(p.creditorId)}
                          </strong>
                          <small>
                            {p.date}{p.note ? " · " + p.note : ""}
                          </small>
                        </div>
                        <div className="home-actions">
                          <HomeBadge tone={{ pending: "warning", confirmed: "success", rejected: "danger" }[p.status]}>
                            {
                              {
                                pending: "Pago por confirmar",
                                confirmed: "Confirmado",
                                rejected: "Rechazado",
                              }[p.status]
                            }
                          </HomeBadge>
                          {data.admin && !p.expenseKind && !p.loanId && (
                            <button
                              className="home-link home-danger"
                              onClick={() =>
                                open("VOID", {
                                  targetId: p.id,
                                  name: "Pago de " + homeMoney(p.cents),
                                })
                              }
                            >
                              Revertir
                            </button>
                          )}
                        </div>
                      </div>
                    ))}
                  {!filteredPayments.length && (
                    <HomeEmpty icon="bi-clock-history" title="Sin pagos para esta selección">
                      Los pagos registrados aparecerán aquí.
                    </HomeEmpty>
                  )}
                </section>
                {data.admin && (
                  <section className="home-panel">
                    <h2>Historial de cambios</h2>
                    <p>
                      Las correcciones conservan el registro original y su motivo.
                    </p>
                    {data.audit
                      .slice()
                      .reverse()
                      .map((e) => (
                        <div className="home-list-row" key={e.id}>
                          <div>
                            <strong>
                              {homeLabels[e.type] || e.type}
                              {e.voided ? " · anulado" : ""}
                            </strong>
                            <small>
                              {e.note} · cuenta {e.actor}
                            </small>
                          </div>
                          <small>
                            {new Date(e.at).toLocaleString("es-HN", {
                              timeZone: "America/Tegucigalpa",
                            })}
                          </small>
                        </div>
                      ))}
                  </section>
                )}
              </>
            )}
            {tab === "settings" && data.admin && (
              <>
                <section className="home-panel">
                  <h2>Transición de los datos anteriores</h2>
                  <p>
                    Las cuentas nuevas se administran por separado. No se han
                    importado deudas ni pagos históricos; no los registres de
                    nuevo sin conciliar sus saldos.
                  </p>
                  <button
                    className="home-btn home-btn-light"
                    disabled={busy}
                    onClick={async () => {
                      setBusy(true);
                      try {
                        setInventory(
                          await homeRpc("homeMigrationPreview", token),
                        );
                      } catch (e) {
                        setError(e.message);
                      } finally {
                        setBusy(false);
                      }
                    }}
                  >
                    Revisar estructura anterior
                  </button>
                  {inventory && (
                    <div className="home-table-wrap" tabIndex={0} role="region" aria-label="Inventario anterior">
                      <table className="home-table">
                        <caption>
                          Inventario de solo lectura. Las filas pueden incluir
                          fórmulas o espacios.
                        </caption>
                        <thead>
                          <tr>
                            <th>Hoja</th>
                            <th>Filas</th>
                            <th>Encabezados</th>
                          </tr>
                        </thead>
                        <tbody>
                          {inventory.map((s) => (
                            <tr key={s.sheet}>
                              <td>{s.sheet}</td>
                              <td>{s.rows}</td>
                              <td>{s.headers.join(" · ")}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </section>
              </>
            )}
          </>
        )}
        {modal && (
          <HomeDialog
            title={
              {
                INIT: "Configurar hogar",
                PERSON: form.id ? "Editar integrante" : "Agregar integrante",
                TEMPLATE: form.id ? "Editar gasto" : "Crear gasto",
                CHARGE: "Registrar factura",
                DEBT: "Registrar deuda entre integrantes",
                PAYMENT: "Registrar pago",
                CONFIRM: "Confirmar recepción",
                REJECT: "Rechazar pago",
                FUND: "Registrar pago completo al proveedor",
                VOID: "Anular movimiento",
              }[modal]
            }
            onClose={close}
            busy={busy}
          >
            <form onSubmit={submit}>
              <fieldset disabled={busy || review} className="home-form">
                {modal === "INIT" && input("Nombre del hogar", "name")}
                {modal === "PERSON" && (
                  <>
                    {input("Nombre del integrante", "name")}
                    <HomeField
                      label="Cuenta de acceso vinculada"
                      hint="La cuenta solo podrá consultar las obligaciones de este integrante. Puedes vincularla después."
                    >
                      <select
                        value={form.userId || ""}
                        onChange={(e) => change("userId", e.target.value)}
                      >
                        <option value="">Sin cuenta por ahora</option>
                        {accounts.map((u) => (
                          <option key={u.id} value={u.id}>
                            {u.nombre_usuario} · {u.nombre_persona}
                          </option>
                        ))}
                      </select>
                    </HomeField>
                    {form.id && (
                      <label className="home-check">
                        <input
                          type="checkbox"
                          checked={form.active}
                          onChange={(e) => change("active", e.target.checked)}
                        />
                        Integrante activo
                      </label>
                    )}
                  </>
                )}
                {["TEMPLATE", "CHARGE"].includes(modal) && (
                  <>
                    {modal === "TEMPLATE" ? (
                      <>
                        {input(
                          "Nombre del gasto",
                          "name",
                          "text",
                          "Por ejemplo, Energía eléctrica o Claro: cable e internet",
                        )}
                        {input("Proveedor", "provider", "text", null, false)}
                      </>
                    ) : (
                      <>
                        <HomeField label="Gasto">
                          <select
                            required
                            value={form.templateId || ""}
                            onChange={(e) => selectTemplate(e.target.value)}
                          >
                            <option value="">Selecciona un gasto</option>
                            {data.templates
                              .filter((t) => t.active)
                              .map((t) => (
                                <option key={t.id} value={t.id}>
                                  {t.name}
                                </option>
                              ))}
                          </select>
                        </HomeField>
                        <div className="home-form-grid">
                          {input("Período", "period", "month")}
                          {input("Total de la factura (L)", "amount", "number")}
                          {input("Fecha de emisión", "date", "date")}
                          {input("Vencimiento", "due", "date")}
                        </div>
                      </>
                    )}
                    <HomeField label="Distribución">
                      <select
                        value={form.mode}
                        onChange={(e) => change("mode", e.target.value)}
                      >
                        {Object.entries(homeMode).map(([id, label]) => (
                          <option key={id} value={id}>
                            {label}
                          </option>
                        ))}
                      </select>
                    </HomeField>
                    {participantsEditor}
                    {modal === "TEMPLATE" && form.id && (
                      <>
                        <label className="home-check">
                          <input
                            type="checkbox"
                            checked={form.active}
                            onChange={(e) => change("active", e.target.checked)}
                          />
                          Gasto activo
                        </label>
                        <p className="home-info">
                          Los cambios se aplican a las próximas facturas. Las
                          anteriores conservan su reparto.
                        </p>
                      </>
                    )}
                    {modal === "CHARGE" &&
                      personSelect(
                        "¿Alguien ya pagó la factura completa?",
                        "payerId",
                        false,
                        "No, todavía se debe al proveedor",
                      )}
                  </>
                )}
                {modal === "DEBT" && (
                  <>
                    {input(
                      "Concepto",
                      "name",
                      "text",
                      "Ejemplo: préstamo para una compra. Registra solo dinero ya entregado; sin intereses en este módulo.",
                    )}
                    {personSelect("¿Quién debe?", "debtorId")}
                    {personSelect("¿A quién le debe?", "creditorId")}
                    <div className="home-form-grid">
                      {input("Monto (L)", "amount", "number")}
                      {input("Fecha de entrega del dinero", "date", "date")}
                      {input("Fecha acordada de pago", "due", "date")}
                    </div>
                  </>
                )}
                {modal === "PAYMENT" && (
                  <>
                    <p className="home-info">
                      {debtPayment?.name}: {name(debtPayment?.debtorId)} →{" "}
                      {name(debtPayment?.creditorId)}.<br />
                      {debtPayment?.creditorId
                        ? "El saldo se reduce cuando el receptor confirma."
                        : "Solo registra dinero ya pagado al proveedor; no dinero recaudado en custodia."}
                    </p>
                    {input("Monto entregado (L)", "amount", "number")}
                    {input("Fecha del pago", "date", "date")}
                    {input("Referencia o nota", "note", "text", null, false)}
                  </>
                )}
                {modal === "FUND" && (
                  <>
                    <p className="home-info">
                      Registra únicamente una factura completa ya pagada y sin
                      abonos. Los aportes de los demás pasarán a ser reembolsos
                      a quien pagó.
                    </p>
                    {personSelect("¿Quién pagó al proveedor?", "payerId")}
                    {input("Fecha del pago", "date", "date")}
                  </>
                )}
                {modal === "CONFIRM" && (
                  <p className="home-info">
                    Confirma que se recibieron{" "}
                    {homeMoney(Math.round(Number(form.amount) * 100))} de este
                    movimiento: {form.name}.
                  </p>
                )}
                {modal === "REJECT" &&
                  input("Motivo del rechazo", "reason", "text")}
                {modal === "VOID" && (
                  <>
                    <p className="home-info">
                      {form.name}. Se conservará el historial y se recalcularán
                      los saldos. Si tiene movimientos relacionados, primero
                      deberán resolverse.
                    </p>
                    {input("Motivo de la anulación", "reason", "text")}
                  </>
                )}
              </fieldset>
              {review && (
                <div className="home-review" role="status">
                  <strong>Revisa los datos antes de confirmar</strong>
                  <p>
                    La operación quedará registrada en el historial del hogar.
                  </p>
                  {form.amount && (
                    <strong>
                      {homeMoney(Math.round(Number(form.amount) * 100))}
                    </strong>
                  )}
                  {form.participants?.length > 0 && (
                    <p>
                      {form.participants
                        .map(
                          (p) =>
                            name(p.personId) +
                            (form.mode === "equal"
                              ? ""
                              : ": " +
                                p.value +
                                (form.mode === "percent" ? " %" : " L")),
                        )
                        .join(" · ")}
                    </p>
                  )}
                </div>
              )}
              {formError && <HomeNotice>{formError}</HomeNotice>}
              <div className="home-dialog-actions">
                <button
                  type="button"
                  className="home-btn home-btn-light"
                  disabled={busy}
                  onClick={() => (review ? setReview(false) : close())}
                >
                  {review ? "Volver a editar" : "Cancelar"}
                </button>
                <button type="submit" className="home-btn" disabled={busy}>
                  {busy
                    ? "Guardando…"
                    : review
                      ? "Confirmar y guardar"
                      : "Revisar datos"}
                </button>
              </div>
            </form>
          </HomeDialog>
        )}
      </div>
    );
  }
</script>
